[project]
name = "back-end"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5.8",
    "fastapi[standard]>=0.136.3",
    "beanie>=2.1.0",
    "pymongo>=4.12.0",
    "langchain-text-splitters>=0.3.8",
    "openai>=1.86.0",
    "python-docx>=1.2.0",
    "pydantic-ai-slim[ag-ui,openai,openrouter]>=1.103.0",
    "pydantic-settings>=2.12.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.1",
    "pytest>=9.0.1",
    "resend>=2.18.0",
    "scalar-fastapi>=1.8.2",
    "logfire>=4.34.0",
    "pytest-asyncio>=1.4.0",
    "pymupdf4llm>=1.27.2.3",
    "obstore>=0.11.0",
    "polar-sdk>=0.31.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:anyio"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 88
target-version = "py314"
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming (naming conventions)
    "ANN",    # flake8-annotations (typed public interfaces)
    "UP",     # pyupgrade (syntax upgrade)
    "B",      # flake8-bugbear (bug prevention)
    "A",      # flake8-builtins (builtin shadowing)
    "ARG",    # flake8-unused-arguments
    "C4",     # flake8-comprehensions (better comprehensions)
    "DTZ",    # flake8-datetimez (timezone-aware datetimes)
    "EM",     # flake8-errmsg (exception message hygiene)
    "ERA",    # eradicate (commented-out code)
    "G",      # flake8-logging-format
    "LOG",    # flake8-logging
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify (simpler code structure)
    "PTH",    # flake8-use-pathlib (use pathlib over os.path)
    "S",      # flake8-bandit (security checks)
    "ASYNC",  # flake8-async (concurrency check)
    "T20",    # flake8-print (prevent prints in production)
    "TRY",    # tryceratops (exception handling hygiene)
    "RUF",    # Ruff-specific rules
    "C90",    # McCabe complexity check
]
ignore = [
    "E501",    # Line length checks are managed by formatter
    "ANN401",  # Dynamic SDK/framework integrations legitimately use Any
    "C901",    # Keep complexity checks advisory for existing business workflows
    "E402",    # Allow import ordering exceptions for startup side-effect control
    "TRY003",  # Keep user-facing exception messages local to handlers/services
    "EM101",   # Allow literal exception messages for concise API errors
    "EM102",   # Allow formatted exception messages for contextual API errors
    "N815",    # Pydantic schemas mirror external camelCase wire contracts
    "PLC0415", # Allow local imports for startup/provider side-effect control
    "PLR0912", # Allow route/service orchestration with several branches
    "PLR0913", # FastAPI dependencies commonly require several parameters
    "PLR0915", # Allow larger business workflow functions
    "PLR0917", # FastAPI dependencies commonly require several parameters
    "PLR2004", # HTTP status checks and domain thresholds are clearer inline
    "S105",    # Secret-looking defaults are placeholders/config fields
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Dev-only CLI utility: print() is the intended user-facing output.
"create_dev_user.py" = ["T201"]
"tests/*" = [
    "ANN",
    "ARG",
    "E402",
    "PLC0415",
    "PLR2004",
    "PLW0108",
    "PT011",
    "S101",
    "S105",
    "S106",
    "S107",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
