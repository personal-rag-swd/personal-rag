[project]
name = "back-end"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.34.0",
    "fastapi[standard]>=0.136.3",
    "psycopg[binary]>=3.2.13",
    "pydantic-ai-slim[ag-ui,openrouter]>=1.103.0",
    "pydantic-settings>=2.12.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.1",
    "pytest>=9.0.1",
    "resend>=2.18.0",
    "scalar-fastapi>=1.8.2",
    "sqlmodel>=0.0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
