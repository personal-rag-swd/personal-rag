services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    command: >
      sh -c "fastapi run app/main.py --host 0.0.0.0 --port 8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openrouter}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_PROVIDER_URL: ${CHAT_PROVIDER_URL}
      CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_PROVIDER_URL: ${EMBEDDING_PROVIDER_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      S3_BUCKET: ${S3_BUCKET:-personal-rag-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_CONSUMER_ENABLED: ${RABBITMQ_CONSUMER_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      RABBITMQ_EXCHANGE_NAME: ${RABBITMQ_EXCHANGE_NAME:-minio-events}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-direct}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-minio.object.created}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-notebook-document-ingestion}
      RABBITMQ_DEAD_LETTER_EXCHANGE_NAME: ${RABBITMQ_DEAD_LETTER_EXCHANGE_NAME:-minio-events-dlx}
      RABBITMQ_DEAD_LETTER_QUEUE_NAME: ${RABBITMQ_DEAD_LETTER_QUEUE_NAME:-notebook-document-ingestion-dead-letter}
      RABBITMQ_DEAD_LETTER_ROUTING_KEY: ${RABBITMQ_DEAD_LETTER_ROUTING_KEY:-notebook-document-ingestion.dead-letter}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-1}
      RABBITMQ_RECONNECT_DELAY_SECONDS: ${RABBITMQ_RECONNECT_DELAY_SECONDS:-5}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/ping'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  minio-mc:
    image: minio/mc:latest
    restart: "no"
    environment:
      S3_BUCKET: ${S3_BUCKET:-personal-rag-bucket}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    entrypoint: >
      /bin/sh -c "
      set -e;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      until mc admin config set local notify_amqp:backend url=\"amqp://$${RABBITMQ_DEFAULT_USER}:$${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672\" exchange=\"${RABBITMQ_EXCHANGE_NAME:-minio-events}\" exchange_type=\"${RABBITMQ_EXCHANGE_TYPE:-direct}\" routing_key=\"${RABBITMQ_ROUTING_KEY:-minio.object.created}\" durable=\"on\"; do sleep 2; done;
      mc admin service restart --json --disable-pager local;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc event rm --force local/$${S3_BUCKET} arn:minio:sqs::backend:amqp --event put || true;
      mc event remove --force local/$${S3_BUCKET} arn:minio:sqs::backend:amqp --event put || true;
      until mc event add local/$${S3_BUCKET} arn:minio:sqs::backend:amqp --event put; do sleep 2; done;
      mc event ls local/$${S3_BUCKET};
      "
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      backend:
        condition: service_started
    restart: always

volumes:
  minio_prod_data:
  rabbitmq_prod_data:
